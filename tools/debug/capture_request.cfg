# Original normal v0.3 ONLY. Verify the UF2 payload via inspect_idle.cfg first.
# User must confirm both wheels supported clear and physical power-off accessible.
source [find interface/cmsis-dap.cfg]
source [find target/rp2040.cfg]
adapter speed 1000
gdb port disabled
tcl port disabled
telnet port disabled
source tools/debug/capture_core.tcl
init
targets rp2040.core0

proc aai05_words {label address count} {
    set words [read_memory $address 32 $count]
    set formatted {}
    foreach value $words {lappend formatted [format %08x $value]}
    echo [format {%s @0x%08x: %s} $label $address $formatted]
}

# Arming performs no motor request, reset, flash or output write.
foreach core {rp2040.core0 rp2040.core1} {
    targets $core
    poll
    if {[aai05_core_state $core] ne "running"} {error {Target not running at idle; assistant must check before any resume}}
}
targets rp2040.core0
foreach address {0x40014044 0x4001404c 0x40014054 0x4001405c} {
    if {[lindex [read_memory $address 32 1] 0] != 5} {error {Not in expected SIO idle; do not press NEXT}}
}
if {([lindex [read_memory 0xd0000010 32 1] 0] & 0xf00) != 0xf00 ||
    ([lindex [read_memory 0x40050050 32 1] 0] & 1) != 0 ||
    ([lindex [read_memory 0x40050064 32 1] 0] & 1) != 0 ||
    ([lindex [read_memory 0xd0000004 32 1] 0] & 0x100000) == 0} {
    error {Not idle or NEXT already held; do not press NEXT}
}

if {[catch {
echo {AAI05 CAPTURE ARMED: wait for the assistant's instruction, then GP20 ONCE}
set deadline [expr {[ms] + 180000}]
set triggered 0
while {[ms] < $deadline} {
    if {([lindex [read_memory 0xd0000004 32 1] 0] & 0x100000) == 0} {
        set triggered 1
        echo {GP20 LOW observed; firmware acceptance/motion not yet established}
        break
    }
    sleep 10
}
if {$triggered} {
    # Debounce/task delay + normal 400ms request, then external capture attempt.
    sleep 650
} else {
    echo {No button observed in three minutes; disarming by coast/halt, not resume}
}

if {[aai05_stop_for_capture]} {
    foreach core {rp2040.core0 rp2040.core1} {
        targets $core
        echo "CAPTURE REGISTERS $core"
        echo [reg]
    }
    targets rp2040.core0
    # Fixed addresses are from the verified original normal v0.3 ELF.
    aai05_words PULSE_STATUS 0x20005ffc 5
    aai05_words PULSE_STARTED_US 0x20005ff8 1
    aai05_words CAPTURE_STATE 0x20005fd0 9
    aai05_words CAPTURE_LOCK 0x20005ff4 1
    aai05_words PULSE_LOCK 0x20006010 1
    aai05_words PRINTF_LOCK 0x20003d94 1
    aai05_words KERNEL_LOCK 0x20003dd8 1
    aai05_words KERNEL_DEPTH 0x20003dd0 2
    aai05_words KERNEL_PRIMASK 0x20003dc8 2
    aai05_words TASK_INDEPENDENT 0x20005fa0 2
    aai05_words FAULT_FRAME_POINTER 0x20005fa8 1
    set frame [lindex [read_memory 0x20005fa8 32 1] 0]
    if {$frame >= 0x20000000 && $frame <= 0x20041fe0 && ($frame & 3) == 0} {
        aai05_words HARDFAULT_FRAME $frame 8
    }
    aai05_words PWM4_CSR 0x40050050 1
    aai05_words PWM5_CSR 0x40050064 1
    aai05_words TIMER_ARMED 0x40054020 1
    aai05_words TIMER_RAW 0x40054028 1
    aai05_words TIMER_DBGPAUSE 0x4005402c 1
    aai05_words TIMER_IRQ 0x40054034 4
    aai05_words NVIC_PENDING 0xe000e200 1
    aai05_words HW_SPINLOCK_STATUS 0xd000005c 1
    echo {CAPTURE COMPLETE: motor GPIO controls were changed by debugger; SWITCH CAR OFF NOW}
}
} capture_error]} {
    echo "ARMED DEBUG ERROR: $capture_error; SWITCH THE CAR OFF IMMEDIATELY"
    if {[catch {aai05_stop_for_capture} stop_error]} {
        echo "Output-removal/halt retry failed: $stop_error; physical power-off required"
    }
}
# Keep the debug connection and halt state until the user removes target power.
# Never silently resume a stopped request or disconnect before power-off confirmation.
while {1} {sleep 100}
