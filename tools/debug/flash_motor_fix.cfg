# v0.3.1 upload only; user powers target by bank VIN with no GP20 press.
source [find interface/cmsis-dap.cfg]
source [find target/rp2040.cfg]
adapter speed 1000
gdb port disabled
tcl port disabled
telnet port disabled
init
targets rp2040.core0
foreach address {0x40014044 0x4001404c 0x40014054 0x4001405c} {
    if {[lindex [read_memory $address 32 1] 0] != 5} {
        error {Motor GPIO is not in fresh SIO idle; power off and check before programming}
    }
}
if {([lindex [read_memory 0xd0000010 32 1] 0] & 0xf00) != 0xf00 ||
    ([lindex [read_memory 0x40050050 32 1] 0] & 1) != 0 ||
    ([lindex [read_memory 0x40050064 32 1] 0] & 1) != 0} {
    error {Motor output is not idle; do not program an active request}
}
echo {Uploading verified motor v0.3.1; no motor request will be sent}
program {output/firmware/AAI05_Motor_Test_v0_3_1.elf} verify reset exit
