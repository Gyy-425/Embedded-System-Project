# One-shot SWD inspection: no flash/program/reset/halt/resume or output writes.
# Target must be powered at idle, GP20 untouched and wheels raised.
source [find interface/cmsis-dap.cfg]
source [find target/rp2040.cfg]
adapter speed 1000
gdb port disabled
tcl port disabled
telnet port disabled
init
echo [targets]
targets rp2040.core0
proc aai05_read_reg {label address} {
    set value [lindex [read_memory $address 32 1] 0]
    echo [format {%s 0x%08x: 0x%08x} $label $address $value]
}
echo {AAI05 IDLE CHECK: SIO output then GPIO8/9/10/11 function controls}
aai05_read_reg SIO_OUT 0xd0000010
aai05_read_reg GPIO8_CTRL 0x40014044
aai05_read_reg GPIO9_CTRL 0x4001404c
aai05_read_reg GPIO10_CTRL 0x40014054
aai05_read_reg GPIO11_CTRL 0x4001405c
echo {AAI05 IDLE CHECK: PWM4/PWM5 CSR then timer alarm0 enable/armed}
aai05_read_reg PWM4_CSR 0x40050050
aai05_read_reg PWM5_CSR 0x40050064
aai05_read_reg TIMER_INTE 0x40054038
aai05_read_reg TIMER_ARMED 0x40054020
echo {AAI05 IDLE CHECK: encoder left/right bank interrupt enables}
aai05_read_reg ENCODER_LEFT_INTE 0x40014100
aai05_read_reg ENCODER_RIGHT_INTE 0x40014108
# Read-only flash copy for comparison with the preserved v0.3 UF2. Private scratch.
dump_image tools/debug/.runtime/idle-flash.bin 0x10000000 0x44b00
shutdown
